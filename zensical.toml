[project]
site_name = "metaTOR"
site_url = "https://koszullab.github.io/metator/"
site_description = "Bin metagenomes from their Hi-C contacts."
site_author = "Romain Koszul Laboratory"
copyright = "&copy; 2021-2026 Romain Koszul Laboratory"
repo_url = "https://github.com/koszullab/metator"
repo_name = "koszullab/metator"
docs_dir = "docs"
site_dir = "site"
# chromokit's stylesheet first, then metaTOR's own (docs/stylesheets/site.css),
# which wins.
extra_css = ["stylesheets/chromokit.css", "stylesheets/site.css"]
extra_javascript = ["javascripts/chromokit.js"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Why metaTOR?" = "why.md" },
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
    { "Concepts" = "concepts.md" }
  ]},
  { "Guides" = [
    { "Running the pipeline" = "guides/pipeline.md" },
    { "Building the network" = "guides/network.md" },
    { "Partition and validation" = "guides/binning.md" },
    { "The contact map of the clusters" = "guides/metacool.md" },
    { "Clustering mobile genetic elements" = "guides/mge.md" },
    { "Curating MAGs with anvi'o" = "guides/curation.md" },
    { "Using the Python API" = "guides/python.md" },
    { "Other tools" = "other-tools.md" }
  ]},
  { "Reference" = [
    { "CLI reference" = "cli.md" },
    { "File formats" = "formats.md" },
    { "Python API" = [
      { "Network" = "api/network.md" },
      { "Partition and validation" = "api/binning.md" },
      { "Contact maps" = "api/metacool.md" },
      { "Mobile genetic elements" = "api/mge.md" },
      { "Input and output" = "api/io.md" }
    ]}
  ]},
  { "Contributing" = "contributing.md" },
  { "Citing metaTOR" = "citation.md" },
  { "Migrating to 2.0" = "migration.md" },
  { "Changelog" = "changelog.md" }
]

# chromokit (https://github.com/js2264/chromokit): the header and the in-column
# footer come from overrides/, the palette and the rest of the look from
# docs/stylesheets/chromokit.css. Those are kit files, listed in chromokit.json:
# `npx github:js2264/chromokit sync` updates them. Local changes go in
# docs/stylesheets/site.css.
[project.theme]
custom_dir = "overrides"
logo = "assets/mark.svg"
favicon = "assets/mark.svg"
# System fonts, as on chromosomix: no web-font request.
font = false
features = [
  "navigation.instant",
  "navigation.expand",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link"
]

# Light and dark follow the system until the header toggle picks one. The
# colours come from chromokit, so `primary` and `accent` are "custom".
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
# Beside the name in the header and in every page's footer. bump-my-version
# keeps it in step with the package (see [tool.bumpversion] in pyproject.toml).
release = "1.4.0"
# The small word after the name ("" for none).
kicker = "docs"

# Zensical's default Markdown extensions (admonitions, tabs, attribute lists,
# icons, keys, Mermaid diagrams, highlighting with language classes) are what
# the kit styles: declaring [project.markdown_extensions] would replace them.

# The Python API pages: `::: metator.<module>` in docs/api/*.md. metaTOR's
# docstrings follow the numpydoc layout.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = true
show_root_heading = true
show_root_full_path = true
show_signature_annotations = true
separate_signature = true
line_length = 80
members_order = "source"
show_submodules = false
filters = ["!^_"]
