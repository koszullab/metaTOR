[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metator"
dynamic = ["version"]
description = "A pipeline for binning metagenomic datasets from metaHiC data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU General Public License v3 (GPLv3)" }

authors = [
    {name = "Amaury Bignaud", email = "amaury.bignaud@pasteur.fr"}, 
    {name = "Jacques Serizay", email = "jacques.serizay@pasteur.fr"},
]
keywords = [
    "metagenomics",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: Unix",
]
dependencies = [
    "igraph>=0.10.3",
    "biopython>=1.80",
    "numpy",
    "pandas",
    "matplotlib>=3.9",
    "scipy",
    "micomplete",
    # Prodigal and HMMER for miComplete, in place of the programs (see
    # metator._micomplete).
    "pyrodigal>=3.0",
    "pyhmmer>=0.10.11",
    "rich-click>=1.9",
    # metaTOR 2.0 needs metacooler 0.4.0: the map's lock and edit sessions,
    # metacooler fasta, the contig network as a table of ids, the QC split
    # at 1001 bp. The bioconda recipe of metaTOR, which the docs recommend,
    # must require metacooler>=0.4.0 too, pysam, pyrodigal and pyhmmer, and
    # drop hicstuff, pypairix, pyfastx, prodigal and hmmer: metacooler
    # must be on bioconda or conda-forge first (submit its recipe if it is
    # not), or the conda package of 2.0 cannot be built.
    "metacooler>=0.4.0",
    # The BAM files that network and pipeline make the map of the contigs
    # from (metator.inputs): pysam reads them, and groups or sorts them by
    # read name with the samtools it carries (no samtools program needed).
    "pysam>=0.22",
    # metator report: report.html, from its Jinja2 template, and
    # report_mqc.yaml, the custom content that MultiQC aggregates.
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The documentation site (docs/, zensical.toml): `uv sync --extra docs`, then
# `uv run zensical serve`.
docs = [
    "zensical>=0.0.43",
    "mkdocstrings[python]>=0.25",
]

[dependency-groups]
# Installed by `uv sync`; never published as package metadata.
dev = [
    "bump-my-version>=0.28",
    "pre-commit>=3",
    "pytest>=8",
    "pytest-cov>=5",
    # The tests read maps object by object (tests/hdf5.py); metaTOR itself
    # reads and writes them through metacooler.
    "h5py>=3.8",
    "ruff>=0.8",
    "ty>=0.0.38",
]

[project.urls]
homepage = "https://github.com/koszullab/metator"
documentation = "https://koszullab.github.io/metator"
repository = "https://github.com/koszullab/metator"
changelog = "https://koszullab.github.io/metator/changelog/"

[project.scripts]
metator = "metator.cli:cli"

[tool.hatch.version]
path = "src/metator/version.py"

[tool.hatch.build.targets.sdist]
# Keep the source distribution small: the test data and documentation images
# live in the repository only.
exclude = [
    "/.github",
    "/tests_data",
    "/docs/images",
]

[tool.ruff]
line-length = 130
src = ["src"]
exclude = [
    "bench/*",
    ".venv",
    "__main__.py",
]
# E501: ruff format wraps the code; long strings and docstrings are allowed.
lint.ignore = ["E402", "E501", "I001"]
# An explicit list: ruff upgrades must not change the rule set.
lint.select = [
    "B",  # bugbear
    "E",  # style errors
    "F",  # pyflakes
    "I",  # isort
    "RUF", # ruff-specific rules
    # "UP", # pyupgrade
    "W",  # style  warnings
]
lint.isort.known-first-party = ["metator"]

[tool.pytest.ini_options]
minversion = "7"
log_cli_level = "INFO"
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=metator",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = ["ignore::PendingDeprecationWarning"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/metator"]
# Measure the Python subprocesses too: miComplete runs as
# `python -m metator._micomplete` (needs coverage >= 7.10).
patch = ["subprocess"]

omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "return NotImplemented",
    "raise NotImplementedError"
]

[tool.bumpversion]
# src/metator/version.py is the single source of truth for the version; this
# current_version is bump-my-version's bookkeeping copy, kept in sync with it.
current_version = "1.4.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore(release): v{new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "src/metator/version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
# The version the documentation's header and footer show.
filename = "zensical.toml"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'

[[tool.bumpversion.files]]
# Promote the "Unreleased" entries to a dated section and open a fresh one.
filename = "docs/changelog.md"
search = "## Unreleased"
replace = "## Unreleased\n\n## [{new_version}] - {now:%Y-%m-%d}"
