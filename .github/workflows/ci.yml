name: CI

on:
  # Other branches are checked through their pull request, or by hand from
  # the Actions tab (workflow_dispatch).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so that upstream releases (pandas 3, metacooler...) surface
    # in the latest-dependencies job instead of on the next unrelated push.
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check lock file consistency
        run: uv lock --check

      - name: Ruff
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests

      - name: Type check
        # Advisory until the existing diagnostics are fixed.
        continue-on-error: true
        run: uv run --locked ty check src

  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # The experimental entry may fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # Every released version pyproject's requires-python allows (>=3.10).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The next Python release, allowed to fail. h5py (for cooler,
          # through metacooler) and pyfastx have no cp315 wheels yet: h5py is
          # built against the system HDF5, and pyfastx downloads the zlib,
          # sqlite and indexed_gzip sources it builds in.
          - python-version: "3.15"
            experimental: true
            extra-apt-packages: libhdf5-dev pkg-config
    steps:
      - uses: actions/checkout@v7

      - name: Install non-Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends prodigal hmmer zlib1g-dev ${{ matrix.extra-apt-packages }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check installed package
        run: uv run --locked metator --version

      - name: Run tests
        run: uv run --locked pytest --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # `test` installs from uv.lock, so it never sees a dependency release newer
  # than the lock. This job re-resolves to the newest allowed versions.
  latest-dependencies:
    name: latest dependencies / py3.14
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: highest
    steps:
      - uses: actions/checkout@v7

      - name: Install non-Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends prodigal hmmer zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Re-resolve ignoring uv.lock
        run: uv lock --upgrade

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q --no-cov
