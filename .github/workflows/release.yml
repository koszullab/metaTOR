name: Release

# Tags are created by bump-my-version (see CONTRIBUTING.md), which bumps
# src/metator/version.py and CHANGELOG.md in the same commit.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the tag matches the package version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -oP '(?<=__version__ = ")[^"]+' src/metator/version.py)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($pkg_version) in src/metator/version.py" >&2
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # Install the wheel as a user would: no checkout on the path, no
      # editable install. This is what would have caught 1.3.10's missing
      # docopt dependency.
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.11 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/metator --version
          /tmp/smoke/bin/metator --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metator/${{ needs.build.outputs.version }}/
    permissions:
      # Trusted publishing (OIDC), no stored token: koszullab/metaTOR must be
      # registered as a trusted publisher of the `metator` PyPI project, with
      # environment name "pypi".
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract this version's changelog section
        run: |
          awk -v ver="${{ needs.build.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## [" ver "]") == 1) { found=1 }; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*

  container:
    name: Build and push the Docker image
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-buildx-action@v3

      - name: Build the image from the released wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metator:test

      - name: Smoke-test the image
        run: docker run --rm metator:test metator --version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/metator
          tags: |
            type=raw,value=v${{ needs.build.outputs.version }}
            type=raw,value=latest

      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
