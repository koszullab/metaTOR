coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error #success, failure, error, ignore
        informational: false
        only_pulls: false
    patch:
      default:
        # At least 80% of the changed lines must be covered. (A threshold of
        # 80% on an `auto` target let an 18.9% patch pass.)
        target: 80%
